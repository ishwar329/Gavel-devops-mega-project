version: "3.8"

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/shell/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-tables:
    build:
      context: .
      dockerfile: scripts/init-tables/Dockerfile
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      dynamodb-local:
        condition: service_healthy
    restart: "no"

  user:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - JWT_SECRET=dev-secret-change-in-production
      - BID_SERVICE_URL=http://bid:8084
    depends_on:
      dynamodb-local:
        condition: service_healthy
      init-tables:
        condition: service_completed_successfully

  shop:
    build:
      context: .
      dockerfile: shop-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=uploads
      - S3_PUBLIC_URL=http://localhost:9000/uploads
      - JWT_SECRET=dev-secret-change-in-production
      - PAYMENT_SERVICE_URL=http://payment:8085
    depends_on:
      dynamodb-local:
        condition: service_healthy
      minio:
        condition: service_healthy
      init-tables:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - user
      - shop
