version: "3.8"

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/shell/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-tables:
    build:
      context: .
      dockerfile: scripts/init-tables/Dockerfile
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      dynamodb-local:
        condition: service_healthy
    restart: "no"

  user:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - JWT_SECRET=dev-secret-change-in-production-key
      - BID_SERVICE_URL=http://bid:8084
    depends_on:
      dynamodb-local:
        condition: service_healthy
      init-tables:
        condition: service_completed_successfully

  shop:
    build:
      context: .
      dockerfile: shop-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=uploads
      - S3_PUBLIC_URL=http://localhost:9000/uploads
      - JWT_SECRET=dev-secret-change-in-production-key
      - PAYMENT_SERVICE_URL=http://payment:8085
    depends_on:
      dynamodb-local:
        condition: service_healthy
      minio:
        condition: service_healthy
      init-tables:
        condition: service_completed_successfully

  bid:
    build:
      context: .
      dockerfile: bid-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=dev-secret-change-in-production-key
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=dev-secret-change-in-production-key
    depends_on:
      dynamodb-local:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-tables:
        condition: service_completed_successfully

  auction:
    build:
      context: .
      dockerfile: auction-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - JWT_SECRET=dev-secret-change-in-production-key
    depends_on:
      dynamodb-local:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-tables:
        condition: service_completed_successfully

  notification:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=dev-secret-change-in-production-key
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - user
      - shop
      - bid
      - notification
